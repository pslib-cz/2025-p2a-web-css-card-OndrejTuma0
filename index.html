<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSCard-Marketer</title>
    <link rel="icon" type="image/vnd.microsoft.icon" href="https://www.prumyslovkaliberec.cz/favicon.ico">
    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <main class="main">
        <figure class="card card--marketer">
            <div class="card__header">
                <p class="card--title">Marketer+</p>
                <p><span class="card--strong"><strong>Pokročilé funkce</strong></span> vhodné zejména pro e-shopy. E-mailing založený na datech.</p>
            </div>
            <div class="card__main">
                <p><span class="card--strong" style="font-size: 24px;"><strong>200 Kč</strong></span> měsíčně</p>
                <small>nebo 300 Kč při <strong><u>měsíční platbě</u></strong></small>
                <div><a href="#" class="button">Vyzkoušejte zdarma</a></div>
            </div>
            <div class="card__footer">
                <ul class="card--list">
                    <li class="li--check"><span class="card--strong"><strong>Neomezené množství e-mailů</strong></span></li>
                    <li class="li--check">Drag&drop editor na tvorbu šablon</li>
                    <li class="li--check">170+ designových šablon</li>
                    <li class="li--check">AI generování předmětu a úpravy textů</li>
                    <li class="li--check">Integrace s e-shopy</li>
                    <li class="li--cross">Slevové kupóny</li>
                    <li class="li--cross">Automatizace podle chování zákazníka</li>
                </ul>
            </div>
        </figure>

        <figure class="card card--executive">
            <div class="card__header">
                <p class="card--title">Executive</p>
                <p>For growing teams</p>
            </div>
            <div class="card__main">
                <div class="pricebox">
                    <p style="margin-bottom: 1em;"><span style="font-size: 52px;"><strong>€349</strong></span></p>
                    <small>per month</small>
                </div>
            </div>
            <div class="card__footer">
                <ul class="card--list">
                    <li>Unlimited invoices</li>
                    <li>Advanced analytics</li>
                    <li>Custom branding</li>
                    <li>24/7 support</li>
                </ul>
                <a href="#" class="button">Get Started</a>
            </div>
        </figure>
    </main>
</body>
</html>
